<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Finanças</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="titulo">
    <h1>Controle de Finanças</h1>
  </header>

  <main class="tabela">
    <div class="btnAdd">
      <button type="button" class="button">Adicionar conta</button>
    </div>

    <form>
      <label class="campo-oculto" for="nome">Nome da conta</label>
      <input id="nome" type="text" placeholder="Nome da conta" required />

      <label class="campo-oculto" for="valor">Valor</label>
      <input id="valor" type="number" placeholder="Valor" min="0" step="0.01" required />

      <label class="campo-oculto" for="vencimento">Vencimento</label>
      <input id="vencimento" type="date" required />

      <label class="campo-oculto" for="status">Status</label>
      <select id="status">
        <option value="Paga">Paga</option>
        <option value="Pendente">Pendente</option>
        <option value="Atrasada">Atrasada</option>
      </select>

      <button type="submit" class="botaoForm">Adicionar</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Conta</th>
          <th>Valor</th>
          <th>Vencimento</th>
          <th>Status</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody>
        <!-- Linhas adicionadas dinamicamente pelo main.js -->
      </tbody>
    </table>
  </main>

  <script type="module" src="main.js"></script>
</body>

</html>
